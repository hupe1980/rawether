name: release

# When a tag `vX.Y.Z` matching rawether's version is pushed: runs the gates once more, publishes
# the crate to crates.io, and only then creates the GitHub release. crates.io uses Trusted
# Publishing: a short-lived token is exchanged for the job's OIDC identity (repository
# hupe1980/rawether, workflow `release.yml`, environment `crates-io`). No long-lived secret is
# stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can say "no" cheaply, before anything irreversible happens.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: The tag names rawether's version
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "tag $GITHUB_REF_NAME does not match rawether $version" >&2; exit 1; }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: scripts/veth-test.sh
      - run: cargo publish --dry-run --locked

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "rawether $GITHUB_REF_NAME"
