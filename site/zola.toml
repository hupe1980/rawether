# rawether: landing page and documentation, built with Zola (0.23.6).
base_url = "https://hupe1980.github.io/rawether"
title = "rawether: raw Ethernet (layer 2) sockets for Rust on Linux, macOS and FreeBSD"
description = "rawether sends and receives raw Ethernet frames from Rust: AF_PACKET with a zero-copy TPACKET_V3 ring, in-kernel BPF filters, hardware timestamps and SO_TXTIME launch times on Linux; BPF devices on macOS and FreeBSD. For PTP, LLDP, TSN, PROFINET and other protocols below IP."
default_language = "en"
compile_sass = false
minify_html = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
generate_feeds = false

[markdown]
smart_punctuation = true
github_alerts = true
insert_anchor_links = "right"
external_links_target_blank = false
external_links_no_referrer = true

[markdown.highlighting]
error_on_missing_language = true
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
include_title = true
include_description = true
include_content = true
truncate_content_length = 2000
index_format = "elasticlunr_javascript"

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
repo = "https://github.com/hupe1980/rawether"
crate = "https://crates.io/crates/rawether"
docs_rs = "https://docs.rs/rawether"
threat_model = "https://github.com/hupe1980/rawether/blob/main/THREAT_MODEL.md"
security = "https://github.com/hupe1980/rawether/blob/main/SECURITY.md"
changelog = "https://github.com/hupe1980/rawether/blob/main/CHANGELOG.md"
author = "hupe1980"
og_image = "og.png"
