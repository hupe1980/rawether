requirements:
- id: SR-001
  statement: The ring walker MUST NOT form a slice outside the block, and MUST NOT read a block whose status lacks
    TP_STATUS_USER.
  priority: P1
  mitigations:
  - mitigation.checked-ring-walk
  acceptance:
  - given: a synthetic block whose frame claims data beyond the block
    then: the walk ends and the rest of the block is skipped
    when: it is walked
  - given: a block owned by the kernel
    then: it reads nothing
    when: the walker starts
  tasks: []
- id: SR-002
  statement: A received Packet MUST borrow the Socket so that no further receive, and no block release, can happen
    while it is alive.
  priority: P1
  mitigations:
  - mitigation.borrowed-packets
  acceptance:
  - given: a Packet from recv
    then: the program does not compile (compile-fail doc test)
    when: the caller calls recv again while holding it
  tasks: []
- id: SR-003
  statement: 'VLAN re-insertion and length reporting MUST be total over every input: no panic, captured length never
    above wire length, truncation flagged.'
  priority: P1
  mitigations:
  - mitigation.bounded-frame-handling
  acceptance:
  - given: any buffer, start, length and tag
    then: it either succeeds inside the buffer or leaves it untouched, never panicking (property test)
    when: re-insertion runs
  tasks: []
- id: SR-004
  statement: The Linux backend MUST attach the filter before binding, and Program::new MUST reject what the kernel
    rejects (empty, too long, jumps past the end, bad scratch slot, no final return).
  priority: P2
  mitigations:
  - mitigation.filter-before-bind
  acceptance:
  - given: a filtered socket on a busy veth
    then: none of another EtherType appears
    when: the first frames are received
  - given: an invalid program
    then: it returns InvalidInput
    when: Program::new runs
  tasks: []
- id: SR-005
  statement: rawether MUST offer drop_capabilities() that leaves the process with no effective or permitted capabilities
    while open sockets keep receiving and sending.
  priority: P1
  mitigations:
  - mitigation.drop-capabilities
  acceptance:
  - given: a socket opened with CAP_NET_RAW
    then: CapEff and CapPrm are zero and the socket still sends and receives
    when: drop_capabilities() returns
  tasks: []
- id: SR-006
  statement: Every descriptor rawether opens MUST be close-on-exec.
  priority: P1
  mitigations:
  - mitigation.close-on-exec
  acceptance:
  - given: an open socket
    then: FD_CLOEXEC is set
    when: its descriptor flags are read
  tasks: []
- id: SR-007
  statement: A default Config MUST NOT enable promiscuous or all-multicast mode.
  priority: P2
  mitigations:
  - mitigation.explicit-promiscuity
  acceptance:
  - given: Config::new(iface)
    then: promiscuous and all-multicast are false
    when: it is inspected
  tasks: []
- id: SR-008
  statement: stats() MUST report kernel drops so that received plus dropped equals what passed the filter.
  priority: P2
  mitigations:
  - mitigation.bounded-buffers-and-counted-drops
  acceptance:
  - given: 100 000 frames sent over veth
    then: received plus dropped equals the frames sent
    when: stats() is read after receiving
  tasks: []
- id: SR-009
  statement: send_at MUST fail with InvalidInput unless Config::tx_time was set, and tx_errors() MUST count frames
    the kernel reported dropped.
  priority: P2
  mitigations:
  - mitigation.txtime-opt-in-and-reported
  acceptance:
  - given: a socket without tx_time
    then: it returns InvalidInput
    when: send_at is called
  - given: a socket with tx_time on an interface without an etf qdisc
    then: tx_errors() counts it or the send fails
    when: a frame is sent with a launch time
  tasks: []
verification:
- id: verification.sr-001.2026-11-09
  requirement: SR-001
  method: test
  evidence: src/ring.rs::tests::offsets_that_point_outside_the_block_end_the_walk
  result: pass
  verdict: verified
  justification: Synthetic blocks with a frame claiming 100000 octets and a first-frame offset past the end end
    the walk and skip the rest; a block with status 0 yields no cursor (a_block_still_owned_by_the_kernel_is_not_read).
    The ring path of the veth suite (8/8) reads real blocks through the same walker.
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-002.2026-11-09
  requirement: SR-002
  method: test
  evidence: src/lib.rs::Socket::recv (compile_fail doctest)
  result: pass
  verdict: verified
  justification: The doctest calls recv twice while the first Packet is alive and is required not to compile; cargo
    test --doc reports it compile-fail ok. The ring is released only at the next recv (src/sys/linux.rs ring_next).
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-003.2026-11-09
  requirement: SR-003
  method: test
  evidence: src/vlan.rs::tests::reinsertion_is_total_over_small_inputs
  result: pass
  verdict: verified
  justification: 'Exhaustive over buffers up to 24 octets and every start/length: either the tag lands inside the
    buffer with the rest intact or the buffer is untouched; no panic. tests/veth.rs::only_the_chosen_ethertypes_arrive_tagged_or_not_each_with_a_timestamp
    asserts wire length equals captured length and the tag position on real frames, on both receive paths.'
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-004.2026-11-09
  requirement: SR-004
  method: test
  evidence: tests/veth.rs::only_the_chosen_ethertypes_arrive_tagged_or_not_each_with_a_timestamp
  result: pass
  verdict: verified
  justification: A frame of another EtherType sent first is not delivered; src/bpf.rs::tests::the_builder_refuses_what_the_kernel_would
    rejects empty, oversized, out-of-range-jump, bad-scratch and no-return programs. The open sequence creates the
    socket with protocol 0 and attaches the filter before bind (src/sys/linux.rs open).
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-005.2026-11-09
  requirement: SR-005
  method: test
  evidence: tests/veth.rs::dropping_capabilities_keeps_open_sockets_and_names_the_capability_when_opening
  result: pass
  verdict: verified
  justification: 'In a child process: after drop_capabilities, CapEff and CapPrm in /proc/thread-self/status are
    zero, the already open socket sends and receives, and a new open fails PermissionDenied naming CAP_NET_RAW.
    Passed on ring and plain paths.'
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-006.2026-11-09
  requirement: SR-006
  method: test
  evidence: tests/veth.rs::every_descriptor_is_close_on_exec
  result: pass
  verdict: verified
  justification: F_GETFD on an open Linux socket has FD_CLOEXEC; the BSD backend opens /dev/bpf with O_CLOEXEC and
    sets FD_CLOEXEC on its membership socket (src/sys/bsd.rs open_device, join_groups) — reviewed, not run on BSD.
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-007.2026-11-09
  requirement: SR-007
  method: test
  evidence: src/lib.rs::tests::the_default_configuration_is_neither_promiscuous_nor_all_multicast
  result: pass
  verdict: verified
  justification: Config::new leaves both flags false; the backends enable them only from those flags.
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-008.2026-11-09
  requirement: SR-008
  method: test
  evidence: tests/veth.rs::a_hundred_thousand_frames_are_received_or_counted_as_dropped
  result: pass
  verdict: verified
  justification: 100000 frames sent in batches; received plus stats().dropped equals 100000 and stats().received
    equals the frames seen, on both receive paths.
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
- id: verification.sr-009.2026-11-09
  requirement: SR-009
  method: review
  evidence: src/sys/linux.rs:send_at
  result: inconclusive
  verdict: implemented-unverified
  justification: 'Scenario 1 passed (send_at without tx_time is InvalidInput, tests/veth.rs::launch_time_needs_configuration_and_a_qdisc_that_honours_it).
    Scenario 2 (etf drops a past launch time and tx_errors counts it) is implemented and tested, but the test skipped:
    the local Docker kernel has no sch_etf. It runs in the ubuntu-24.04 CI lane.'
  verified_at: '2026-11-09T10:16:23Z'
  commit: 0c1eb6b
