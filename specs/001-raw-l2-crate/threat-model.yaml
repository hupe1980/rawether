    status: verified
    kind: detective
    requirements:
    - SR-008
    touchpoints:
    - src/sys/linux.rs
    - src/sys/bsd.rs
- id: mitigation.bounded-frame-handling
  name: 'Re-insertion and length reporting are bounds-checked and total: captured and wire lengths reported, truncation
