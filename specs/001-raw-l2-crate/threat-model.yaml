otmVersion: 0.2.0
project:
  id: 001-raw-l2-crate
  name: rawether 0.1.0 — raw layer-2 Ethernet I/O
threatspec:
  actors:
  - id: actor.caller
    name: The application using rawether
    trust: trusted
  - id: actor.child-process
    name: A program the caller later executes
    trust: semi-trusted
  - id: actor.kernel
    name: The kernel sharing the receive ring
    trust: privileged
  - id: actor.segment-peer
    name: Any device or attacker able to put frames on the link
    trust: untrusted
  dispositions:
  - disposition: not-applicable
    reason: 'no authentication surface: rawether handles no credentials; its only privilege is the raw-socket capability,
      modelled under broken-access-control'
    technique: credential-theft
  - disposition: no-threat-detected
    reason: 'checked the receive path: layer 2 has no sender identity and the crate claims none; source MACs are
      delivered as received, and authenticating them is the caller''s protocol''s job'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: 'no persistent-store surface: nothing is written to disk'
    technique: data-tampering-at-rest
  - disposition: not-applicable
    reason: 'no audit-relevant surface: a socket library keeps no audit log'
    technique: missing-audit-trail
  - disposition: not-applicable
    reason: 'no shared-tenant surface: one socket belongs to one process'
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: 'no persistent-store surface: configuration is a value the caller builds in code'
    technique: privilege-escalation-via-config
