project:
  id: 002-ethernet-frames
  name: Ethernet frame views and frame building
threatspec:
  actors:
  - id: actor.caller
    name: The application using rawether
    trust: trusted
  - id: actor.segment-peer
    name: Any device or attacker able to put frames on the link
    trust: untrusted
  dispositions:
  - disposition: not-applicable
    reason: 'no authentication surface: the view and builder handle no credentials'
    technique: credential-theft
  - disposition: no-threat-detected
    reason: 'checked the view: it reports the source address as received and claims no sender identity; spoofed
      sources are out of scope (THREAT_MODEL.md, frame authenticity) — the reply helper''s use of that address is
      modelled as threat.reply-reflection'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: 'no persistent-store surface: nothing is stored'
    technique: data-tampering-at-rest
  - disposition: not-applicable
    reason: 'no audit-relevant surface: pure functions over byte slices'
    technique: missing-audit-trail
  - disposition: not-applicable
    reason: no shared-tenant surface
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: 'no authorization surface: the view and builder need no privilege and open nothing (FR-009)'
    technique: broken-access-control
  - disposition: not-applicable
    reason: no persistent-store surface
    technique: privilege-escalation-via-config
  exclusions:
  - entity: VLAN tag
    reason: 'a value inside a frame, not a separate asset: its integrity is part of asset.outgoing-frames (threat.tag-field-truncation)
      and asset.frame-interpretation (threat.view-filter-disagreement)'
