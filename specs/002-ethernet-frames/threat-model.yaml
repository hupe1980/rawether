requirements:
- id: SR-001
  statement: Taking an Ethernet view MUST NOT panic for any byte slice, and MUST return no view when the slice is
    shorter than the header it announces.
  priority: P1
  mitigations:
  - mitigation.total-view
  acceptance:
  - given: every byte slice up to 24 octets with each tag identifier at offsets 12 and 16
    then: it returns without panicking, and returns a view only when the announced header fits
    when: a view is taken
  - given: randomised byte slices up to 1600 octets
    then: nothing panics and the payload lies inside the slice
    when: a view is taken and every field and the payload are read
  tasks: []
- id: SR-002
  statement: For every set S containing no tag identifier (0x8100, 0x88A8) and every frame that Program::ethertypes(S)
    accepts, the view's EtherType MUST be in S, using the same tag identifiers (0x8100, 0x88A8) and the same depth
    (two tags).
  priority: P1
  mitigations:
  - mitigation.shared-tag-rules
  acceptance:
  - given: frames with zero, one, two and three tags of either identifier
    then: whenever the filter accepts, the view's EtherType is in S
    when: the filter for a set S is run through Program::run and the view is taken
  tasks: []
- id: SR-003
  statement: Making a VLAN tag from fields MUST fail for a VID above 4095 or a PCP above 7.
  priority: P2
  mitigations:
  - mitigation.checked-tag-fields
  acceptance:
  - given: VID 4096 or PCP 8
    then: it is refused
    when: a tag is made from fields
  - given: VID 4095, PCP 7, DEI set
    then: the wire TCI is 0xFFFF
    when: a tag is made and written
  tasks: []
- id: SR-004
  statement: Building a frame MUST leave the growable buffer, or the returned prefix of a fixed slice, holding exactly
    the new frame, with any padding zero, whatever the buffer held before; a fixed slice too small MUST yield an
    error, not a partial frame.
  priority: P2
  mitigations:
  - mitigation.replace-and-zero-pad
  acceptance:
  - given: a buffer filled with 1518 octets of 0xAA
    then: the buffer is 60 octets long and octets 19 to 59 are zero
    when: a frame with a 5-octet payload is built into it
  - given: a fixed 1518-octet slice filled with 0xAA
    then: the returned length is 60 and octets 19 to 59 of the slice are zero
    when: a frame with a 5-octet payload is written into it
  - given: a fixed slice shorter than the frame
    then: an error names the size needed and no length is returned
    when: a frame is written into it
  tasks: []
- id: SR-005
  statement: Building a reply MUST NOT produce a frame when the received frame's source address is a group (multicast
    or broadcast) address.
  priority: P2
  mitigations:
  - mitigation.no-reply-to-groups
  acceptance:
  - given: a received frame whose source is ff:ff:ff:ff:ff:ff or 01:00:5e:00:00:01
    then: none is built
    when: a reply is requested
  tasks: []
- id: SR-006
  statement: The view's documentation MUST state that a truncated packet's payload covers only the captured octets
    and point to Packet::is_truncated.
  priority: P3
  mitigations:
  - mitigation.truncation-visible
  acceptance:
  - given: the rustdoc of the payload accessor and of Packet's view accessor
    then: it names is_truncated
    when: it is read
  tasks: []
verification:
