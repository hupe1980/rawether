  risk:
    impact: 80
    likelihood: 10
  attributes:
    source: spec.md#User-Story-6
    assets:
    - asset.process-memory
    status: mitigated
    actor: actor.kernel
    disposition: threat
    elements:
    - component.ring-walker
    - flow.ring-blocks
    profile: stride
    severity: medium
    technique: injection
- id: threat.silent-downgrade
  name: An explicitly requested ring that the kernel refuses becomes the plain path without an error, so the caller
    runs with a configuration it did not ask for
  categories:
  - Tampering
  cwes:
  - CWE-636
  risk:
    impact: 40
    likelihood: 40
  attributes:
    source: spec.md#User-Story-4
    assets:
    - asset.accounting
    status: mitigated
    actor: actor.caller
    disposition: threat
    elements:
    - component.linux-backend
    profile: stride
    severity: medium
    technique: data-tampering-in-transit
- id: threat.sockaddr-provenance
  name: The BSD hardware-address lookup reads past the reference it derived its pointer from, undefined behaviour
    under the language's aliasing model
  categories:
  - Tampering
  cwes:
  - CWE-758
  risk:
    impact: 60
    likelihood: 10
  attributes:
    source: spec.md#User-Story-1
    assets:
    - asset.process-memory
    status: mitigated
    actor: actor.kernel
    disposition: threat
    elements:
    - component.bsd-backend
    profile: stride
    severity: low
    technique: injection
- id: threat.stats-misreport
  name: On BSD stats().received counts frames before the filter, so a caller sizing buffers or detecting loss reads
    a number that means something else than on Linux
  categories:
  - Tampering
  cwes:
  - CWE-684
  risk:
    impact: 30
    likelihood: 60
  attributes:
    source: spec.md#User-Story-5
    assets:
    - asset.accounting
    status: mitigated
    actor: actor.kernel
    disposition: threat
    elements:
    - component.bsd-backend
    profile: stride
    severity: low
    technique: data-tampering-in-transit
- id: threat.tx-errors-miscounted
  name: tx_errors counts every error-queue message, so the caller cannot tell launch-time drops from other reports,
    nor why a frame was dropped
  categories:
  - Repudiation
  cwes:
  - CWE-684
  risk:
    impact: 40
    likelihood: 40
  attributes:
    source: spec.md#User-Story-5
    assets:
    - asset.accounting
    status: mitigated
    actor: actor.kernel
    disposition: threat
    elements:
    - component.linux-backend
    - flow.control-messages
    profile: stride
    severity: medium
    technique: injection
mitigations:
- id: mitigation.checked-arithmetic
  name: checked_add for deadlines (overflow = no deadline), checked_mul and limits for ring geometry, checked_add
    for BPF jumps
  riskReduction: 90
  attributes:
    threats:
    - threat.numeric-limits-panic
    status: verified
    kind: preventive
    requirements:
    - SR-008
    touchpoints:
    - src/sys/mod.rs
    - src/config.rs
    - src/bpf.rs
- id: mitigation.checked-control-messages
  name: Skip control messages when MSG_CTRUNC is set or cmsg_len is shorter than the payload read
  riskReduction: 90
  attributes:
    threats:
    - threat.control-message-overread
    status: verified
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - src/sys/linux.rs
- id: mitigation.counted-deliveries
  name: On BSD count delivered records for stats().received; bs_drop for dropped
  riskReduction: 80
  attributes:
    threats:
    - threat.stats-misreport
    status: verified
    kind: detective
    requirements:
    - SR-012
    touchpoints:
    - src/sys/bsd.rs
- id: mitigation.explicit-ring-errors
  name: An explicit RxMode::Ring that fails to set up fails the open; Auto falls back and reports it
  riskReduction: 85
  attributes:
    threats:
    - threat.silent-downgrade
    status: verified
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - src/sys/linux.rs
- id: mitigation.freebsd-direction
  name: Set BIOCSDIRECTION to BPF_D_IN on FreeBSD unless see_outgoing
  riskReduction: 90
  attributes:
    threats:
    - threat.own-frames-on-freebsd
    status: verified
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - src/sys/bsd.rs
- id: mitigation.layout-aware-record-parse
  name: Parse BPF records field by field with per-platform offsets from the libc struct and the kernel's SIZEOF_BPF_HDR
    minimum
  riskReduction: 90
  attributes:
    threats:
    - threat.bpf-record-misparse
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - src/bpf_record.rs
    - src/sys/bsd.rs
    - fuzz/fuzz_targets/bpf_record.rs
- id: mitigation.narrow-ring-borrows
  name: The walker reads a shared slice; only the frame range VLAN re-insertion writes is borrowed mutably
  riskReduction: 80
  attributes:
    threats:
    - threat.ring-mutable-alias
    status: verified
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - src/ring.rs
    - src/vlan.rs
    - src/sys/linux.rs
- id: mitigation.parsed-error-queue
  name: Parse sock_extended_err and count only SO_EE_ORIGIN_TXTIME, by code
  riskReduction: 85
  attributes:
    threats:
    - threat.tx-errors-miscounted
    status: verified
    kind: detective
    requirements:
    - SR-011
    touchpoints:
    - src/sys/linux.rs
    - src/lib.rs
- id: mitigation.process-wide-capability-check
  name: Clear all capability sets of the calling thread, drop the bounding set where allowed, require no_new_privs,
    then refuse when any other thread still holds a capability
  riskReduction: 85
  attributes:
    threats:
    - threat.capability-kept-by-other-threads
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - src/sys/linux.rs
    - tests/drop_capabilities.rs
- id: mitigation.raw-pointer-provenance
  name: Derive the link-layer address pointer from the raw ifa_addr pointer and offset_of!
  riskReduction: 90
  attributes:
    threats:
    - threat.sockaddr-provenance
    status: verified
    kind: preventive
    requirements:
    - SR-007
    touchpoints:
    - src/sys/bsd.rs
- id: mitigation.read-first-never-lower
  name: Read the NIC's timestamp configuration first; never write one that could not be read; keep tx_type; widen
    the RX filter only from none
  riskReduction: 90
  attributes:
    threats:
    - threat.nic-timestamp-config-clobbered
    status: verified
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - src/hwtstamp.rs
    - src/sys/linux.rs
- id: mitigation.socket-error-surfaces
  name: On POLLERR/POLLHUP read SO_ERROR and return it from recv, on both receive paths
  riskReduction: 90
  attributes:
    threats:
    - threat.recv-spins-on-socket-error
    status: verified
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - src/sys/mod.rs
    - src/sys/linux.rs
    - tests/veth.rs
requirements:
- id: SR-001
  statement: The BSD record parser MUST accept both macOS (minimum header 18) and FreeBSD (minimum header 26) layouts,
    read header fields only inside the buffer, and stop without panicking at a malformed or truncated record.
  priority: P1
  mitigations:
  - mitigation.layout-aware-record-parse
  acceptance:
  - given: a FreeBSD-layout buffer with three records
    then: three frames are returned with their lengths and timestamps
    when: it is parsed
  - given: a record with hdrlen below the minimum, or a header cut off at the buffer end
    then: parsing stops and nothing panics or reads outside the buffer
    when: it is parsed
  - given: random buffers
    then: no panic and every frame lies inside the buffer
    when: they are parsed with each layout
  tasks: []
- id: SR-002
  statement: drop_capabilities MUST leave no thread of the process with an effective, permitted, inheritable or
    ambient capability and MUST set no_new_privs, or return an error naming the threads that still hold capabilities.
  priority: P1
  mitigations:
  - mitigation.process-wide-capability-check
  acceptance:
  - given: a single-threaded process with CAP_NET_RAW and an open socket
    then: every /proc/self/task/*/status shows zero CapEff, CapPrm, CapInh and CapAmb, NoNewPrivs is 1, and the
      socket still sends and receives
    when: drop_capabilities returns Ok
  - given: a second thread holding capabilities
    then: it returns an error naming one thread
    when: drop_capabilities runs
  tasks: []
- id: SR-003
  statement: With hardware timestamps requested, rawether MUST NOT write a NIC timestamp configuration it could
    not read, MUST NOT lower tx_type or narrow the RX filter, and MUST widen the RX filter only from none.
  priority: P1
  mitigations:
  - mitigation.read-first-never-lower
  acceptance:
  - given: every combination of current tx_type and rx_filter, and whether configuring is allowed
    then: the written configuration (if any) keeps tx_type and changes rx_filter only from NONE to ALL
    when: the decision runs
  - given: a NIC whose configuration cannot be read
    then: no configuration is written and the socket reports software timestamps
    when: a hardware-timestamping socket opens
  tasks: []
- id: SR-004
  statement: A receive on either Linux path MUST return the socket's pending error instead of polling again when
    the descriptor reports an error or hang-up.
  priority: P1
  mitigations:
  - mitigation.socket-error-surfaces
  acceptance:
  - given: a socket waiting in recv with a 2 s timeout on the ring and on the plain path
    then: recv returns an error within 100 ms
    when: the link goes down or the interface is deleted
  - given: the link back up
    then: the socket receives it again
    when: a frame is sent
  tasks: []
- id: SR-005
  statement: Control messages MUST be read only when MSG_CTRUNC is clear and cmsg_len covers the payload read.
  priority: P2
  mitigations:
  - mitigation.checked-control-messages
  acceptance:
  - given: a control buffer with a message whose cmsg_len is shorter than the payload type
    then: the message is skipped
    when: it is parsed
  - given: msg_flags with MSG_CTRUNC
    then: none is read
    when: the messages are parsed
  tasks: []
- id: SR-006
  statement: The ring walker MUST read blocks through a shared slice and borrow mutably only the octets VLAN re-insertion
    writes.
  priority: P2
  mitigations:
  - mitigation.narrow-ring-borrows
  acceptance:
  - given: the ring module
    then: the walker takes &[u8], re-insertion takes a &mut range of the frame only, and Miri reports nothing
    when: its signatures are reviewed and its tests run under Miri
  tasks: []
- id: SR-007
  statement: The BSD hardware-address lookup MUST derive its read pointer from the raw ifa_addr pointer, never from
    a reference to sockaddr_dl.
  priority: P3
  mitigations:
  - mitigation.raw-pointer-provenance
  acceptance:
  - given: the lookup code
    then: no &sockaddr_dl is formed and the offset comes from offset_of!; the macOS test still opens lo0
    when: it is reviewed
  tasks: []
- id: SR-008
  statement: No timeout, ring geometry or BPF program MUST cause a panic or a wrapped value, on 64-bit and 32-bit
    targets.
  priority: P2
  mitigations:
  - mitigation.checked-arithmetic
  acceptance:
  - given: recv with Duration::MAX
    then: it returns without panicking
    when: it runs on a non-blocking socket
  - given: a ring geometry whose total size overflows u32 or usize, or a block count above the limit
    then: InvalidInput
    when: it is validated
  - given: a BPF ja with k = u32::MAX
    then: it is refused, and run returns 0
    when: Program::new and Program::run run
  tasks: []
- id: SR-009
  statement: An explicit RxMode::Ring that cannot be set up MUST fail the open with the kernel's reason; RxMode::Auto
    MUST fall back and report RxPath::Plain.
  priority: P2
  mitigations:
  - mitigation.explicit-ring-errors
  acceptance:
  - given: RxMode::Ring with a block size that is not a page multiple
    then: it fails with InvalidInput
    when: the socket opens
  tasks: []
- id: SR-010
  statement: On FreeBSD a socket without see_outgoing MUST set BIOCSDIRECTION to BPF_D_IN.
  priority: P2
  mitigations:
  - mitigation.freebsd-direction
  acceptance:
  - given: the FreeBSD backend
