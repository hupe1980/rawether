otmVersion: 0.2.0
project:
  id: 003-audit-remediation
  name: Audit remediation — correct on every platform, harmless to the host
threatspec:
  actors:
  - id: actor.caller
    name: The application using rawether
    trust: trusted
  - id: actor.host-program
    name: Another program on the host sharing the NIC (for example ptp4l)
    trust: trusted
  - id: actor.kernel
    name: The kernel and its drivers, writing ring metadata, BPF records and control messages
    trust: privileged
  - id: actor.segment-peer
    name: Any device or attacker able to put frames on the link, or to take the link down
    trust: untrusted
  dispositions:
  - disposition: not-applicable
    reason: 'no authentication surface: no credentials are handled; the raw-socket privilege is modelled under broken-access-control'
    technique: credential-theft
  - disposition: no-threat-detected
    reason: 'checked the changed paths (BSD parser, capability drop, timestamp config, error queue): none relies
      on a sender''s identity; frame authenticity stays out of scope (THREAT_MODEL.md)'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: 'no persistent-store surface: nothing is written to disk'
    technique: data-tampering-at-rest
  - disposition: not-applicable
    reason: 'no audit-relevant surface: a socket library keeps no audit log'
    technique: missing-audit-trail
  - disposition: not-applicable
    reason: 'no shared-tenant surface: one socket belongs to one process'
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: 'no persistent-store surface: configuration is a value built in code'
    technique: privilege-escalation-via-config
  - disposition: no-threat-detected
    reason: 'checked the changed read paths: the BSD parser and control-message reads only shorten or skip data;
      they disclose nothing new; over-reads are modelled as tampering of process memory'
    technique: sensitive-data-exposure
  exclusions:
  - entity: Effective timestamping
    reason: reported state, part of asset.accounting; its correctness is threat.nic-timestamp-config-clobbered's
      requirement SR-003
  - entity: Hardware timestamp configuration
    reason: modelled as component.nic and asset.host-time-sync
  - entity: BPF record layout
    reason: a property of component.bsd-parser, modelled through threat.bpf-record-misparse
  - entity: Launch-time error counts
    reason: an output of component.linux-backend, modelled through threat.tx-errors-miscounted
  extends: .specify/memory/threat-model.yaml
  generated: '2026-11-09T12:26:35Z'
  profiles:
  - stride
  sources:
  - path: plan.md
    sha256: 6b8a97c3d0142cb2dc6fcbc567110ae8b49bcbe92b8d1b94913c2966ca251d60
  - path: spec.md
    sha256: 6d46be197ee3af463672270199cc02a2f5fd299864ab233a35e0103cbba08669
  surfaces:
  - external-input
  - network-boundary
  - authorization
  version: '0.1'
trustZones:
- id: tz.host
  name: Host-wide state shared with other programs (NIC configuration)
  risk:
    trustRating: 7
- id: tz.kernel
  name: The kernel and its shared ring
  risk:
    trustRating: 9
- id: tz.link
  name: The Ethernet segment (unauthenticated)
  risk:
    trustRating: 1
- id: tz.process
  name: The caller's process
  risk:
    trustRating: 8
assets:
- id: asset.accounting
  name: 'Counters and configuration the caller relies on: stats, tx_errors, the receive path and timestamping in
    effect'
  risk:
    availability: 20
    confidentiality: 0
    integrity: 70
  attributes:
    type: business-data
    source: spec.md#User-Story-5
    classification: internal
- id: asset.host-time-sync
  name: The NIC's hardware timestamping configuration that other programs (ptp4l) rely on for clock synchronisation
  risk:
    availability: 85
    confidentiality: 0
    integrity: 85
  attributes:
    type: business-data
    source: spec.md#User-Story-3
    classification: internal
- id: asset.process-memory
  name: Memory safety of the caller's process
  risk:
    availability: 80
    confidentiality: 80
    integrity: 95
  attributes:
    type: business-data
    source: THREAT_MODEL.md#Assets
    classification: internal
- id: asset.raw-capability
  name: The raw-socket capability (CAP_NET_RAW, CAP_NET_ADMIN) held by any thread of the process
  risk:
    availability: 30
    confidentiality: 60
    integrity: 85
  attributes:
    type: credential
    source: spec.md#User-Story-2
    classification: restricted
- id: asset.receive-availability
  name: 'The caller''s receive loop: delivering frames without stalling, spinning or crashing'
  risk:
    availability: 85
    confidentiality: 0
    integrity: 40
  attributes:
    type: business-data
    source: spec.md#User-Story-4
    classification: internal
components:
