  attributes:
    source: spec.md#FR-010
- id: component.bsd-backend
  name: BPF device backend (unsafe FFI)
  type: library
  parent:
    trustZone: tz.process
  attributes:
    source: spec.md#FR-002
- id: component.bsd-parser
  name: BPF read-buffer record parser
