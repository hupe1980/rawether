threats:
- id: threat.bpf-record-misparse
  name: The BSD record parser assumes one platform's header layout, so on FreeBSD it rejects every record the kernel
    writes and the caller's receive never returns a frame
  categories:
  - Denial of Service
  cwes:
  - CWE-131
  - CWE-20
  risk:
    impact: 70
    likelihood: 90
  attributes:
    source: spec.md#User-Story-1
    assets:
    - asset.receive-availability
    - asset.process-memory
    status: mitigated
    actor: actor.kernel
    disposition: threat
    elements:
    - component.bsd-parser
    - flow.bpf-read-buffer
    profile: stride
    severity: critical
    technique: resource-exhaustion
- id: threat.capability-kept-by-other-threads
  name: Threads that existed before drop_capabilities keep CAP_NET_RAW, so a parser defect exploited in any thread
    still reaches raw-network privilege through the shared address space
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-250
  - CWE-273
  risk:
    impact: 80
    likelihood: 60
  attributes:
    source: spec.md#User-Story-2
    assets:
    - asset.raw-capability
    status: mitigated
    actor: actor.segment-peer
    disposition: threat
    elements:
    - component.capability-drop
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.control-message-overread
  name: A control message shorter than the structure read from it, or a truncated control buffer, makes the backend
    read past the message into its own state
  categories:
  - Tampering
  cwes:
  - CWE-125
  risk:
    impact: 90
    likelihood: 10
  attributes:
    source: spec.md#User-Story-6
    assets:
    - asset.process-memory
    status: mitigated
    actor: actor.kernel
    disposition: threat
    elements:
    - component.linux-backend
    - flow.control-messages
    profile: stride
    severity: medium
    technique: injection
- id: threat.nic-timestamp-config-clobbered
  name: Opening a socket with hardware timestamps overwrites the NIC's device-wide configuration, turning off the
    transmit stamps ptp4l needs and degrading the host's time synchronisation
  categories:
  - Tampering
  - Denial of Service
  cwes:
  - CWE-1188
  - CWE-664
  risk:
    impact: 80
    likelihood: 70
  attributes:
    source: spec.md#User-Story-3
    assets:
    - asset.host-time-sync
    status: mitigated
    actor: actor.caller
    disposition: threat
    elements:
    - component.hwtstamp-config
    - component.nic
    - flow.hwtstamp-write
    profile: stride
    severity: critical
    technique: data-tampering-in-transit
- id: threat.numeric-limits-panic
  name: A caller passes Duration::MAX as a timeout, a huge ring geometry or a far BPF jump, and rawether panics
    or wraps instead of refusing
  categories:
  - Denial of Service
  cwes:
  - CWE-190
  - CWE-248
  risk:
    impact: 50
    likelihood: 40
  attributes:
    source: spec.md#User-Story-4
    assets:
    - asset.receive-availability
    status: mitigated
    actor: actor.caller
    disposition: threat
    elements:
    - component.config
    - component.bpf
    - component.linux-backend
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.own-frames-on-freebsd
  name: On FreeBSD a socket configured not to see its own transmissions receives them anyway, so a responder can
    answer itself in a loop
  categories:
  - Tampering
  - Denial of Service
  cwes:
  - CWE-670
  risk:
    impact: 40
    likelihood: 60
  attributes:
    source: spec.md#User-Story-1
    assets:
    - asset.receive-availability
    status: mitigated
    actor: actor.caller
    disposition: threat
    elements:
    - component.bsd-backend
    profile: stride
    severity: medium
    technique: data-tampering-in-transit
- id: threat.recv-spins-on-socket-error
  name: When the link goes down or the interface is removed, a ring receive sees the descriptor as ready forever
    and spins a CPU core instead of returning, until its deadline or never
  categories:
  - Denial of Service
  cwes:
  - CWE-835
  - CWE-400
  risk:
    impact: 70
    likelihood: 60
  attributes:
    source: spec.md#User-Story-4
    assets:
    - asset.receive-availability
    status: mitigated
    actor: actor.segment-peer
    disposition: threat
    elements:
    - component.linux-backend
    - flow.link-state
    profile: stride
    severity: high
    technique: resource-exhaustion
- id: threat.ring-mutable-alias
  name: A mutable slice over a whole ring block, descriptor included, asserts exclusive access to memory the kernel
    still reads, which the compiler may exploit
  categories:
