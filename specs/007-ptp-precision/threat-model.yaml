threats:
- id: threat.error-queue-starves-receive
  name: Unread transmit timestamps keep the socket's error flag raised, so a receive spins a core, or an unbounded
    buffer of them grows without limit
  categories:
  - Denial of Service
  cwes:
  - CWE-835
  - CWE-770
  risk:
    impact: 70
    likelihood: 60
  attributes:
    source: spec.md#User-Story-4
    assets:
    - asset.receive-availability
    status: open
    actor: actor.caller
    disposition: threat
    elements:
    - component.error-queue
    - flow.error-queue
    profile: stride
    severity: high
    technique: resource-exhaustion
- id: threat.nic-tx-config-lowered
  name: Requesting hardware transmit stamps changes the NIC's transmit mode under ptp4l (turning it off or out of
    a one-step mode), breaking the host's time synchronisation
  categories:
  - Tampering
  - Denial of Service
  cwes:
  - CWE-664
  risk:
    impact: 80
    likelihood: 50
  attributes:
    source: spec.md#User-Story-3
    assets:
