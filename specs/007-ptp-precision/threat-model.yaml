    status: open
    actor: actor.caller
    disposition: threat
    elements:
    - component.hwtstamp-config
    - component.nic
    - flow.hwtstamp-write
    profile: stride
    severity: high
    technique: data-tampering-in-transit
- id: threat.timestamp-cmsg-overread
  name: An error-queue report whose control messages are shorter than the timestamp or error structure read from
