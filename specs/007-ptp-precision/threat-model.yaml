mitigations:
- id: mitigation.bounded-report-queue
  name: Drain the error queue into a preallocated, bounded queue on every POLLERR; drop the oldest and count
  riskReduction: 85
  attributes:
    threats:
    - threat.error-queue-starves-receive
    status: required
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - src/sys/linux.rs
- id: mitigation.checked-report-cmsgs
  name: Read scm_timestamping and sock_extended_err only through the length-checked cmsg reader; ignore truncated
    buffers
  riskReduction: 90
  attributes:
    threats:
    - threat.timestamp-cmsg-overread
    status: required
    kind: preventive
    requirements:
    - SR-005
    touchpoints:
    - src/sys/linux.rs
- id: mitigation.explicit-ids
  name: Assign each frame's id in user space and pass it with SCM_TS_OPT_ID (Linux 6.13+), detected by the kernel
    accepting it; announce ids before the send
  riskReduction: 90
  attributes:
    threats:
    - threat.tx-timestamp-misattributed
    status: required
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - src/sys/linux.rs
    - tests/veth.rs
- id: mitigation.one-dispatcher
  name: 'One error-queue reader classifies every report: timestamps to the queue, launch-time reports to the counts'
  riskReduction: 90
  attributes:
    threats:
    - threat.tx-reports-lost
    status: required
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - src/sys/linux.rs
- id: mitigation.tx-read-first-never-lower
  name: Raise tx_type only from OFF to ON, after a successful read; never touch one-step modes
  riskReduction: 90
  attributes:
    threats:
    - threat.nic-tx-config-lowered
    status: required
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - src/hwtstamp.rs
    - src/sys/linux.rs
- id: mitigation.unsupported-is-an-error
  name: open fails with Unsupported when transmit timestamps are requested on BPF
  riskReduction: 90
  attributes:
    threats:
    - threat.unsupported-silently-ignored
    status: required
    kind: preventive
    requirements:
    - SR-006
    touchpoints:
    - src/sys/bsd.rs
requirements:
- id: SR-001
  statement: Every transmit timestamp MUST carry the identifier the socket announced for its frame, also after a
    send the kernel refused (Linux 6.13 and later).
  priority: P1
  mitigations:
  - mitigation.explicit-ids
  acceptance:
  - given: 1 000 frames sent in single and batched sends with software transmit timestamps on veth
    then: their identifiers are exactly the announced ones
    when: the timestamps are read
  - given: a send refused by an etf qdisc (past launch time)
    then: their timestamps carry the identifiers announced for them
    when: 10 more frames are sent
  tasks: []
- id: SR-002
  statement: Requesting hardware transmit timestamps MUST NOT change a NIC whose configuration could not be read,
    MUST raise tx_type only from OFF to ON, and MUST leave every other tx_type and the receive filter rule of 0.1.0
    unchanged.
  priority: P1
  mitigations:
  - mitigation.tx-read-first-never-lower
  acceptance:
  - given: every tx_type 0..=3, rx_filter 0..=15, and receive/transmit requests
    then: a write raises tx_type only from OFF to ON, rx_filter only from NONE to ALL, and changes nothing else
    when: the decision runs
  tasks: []
- id: SR-003
  statement: Unread transmit timestamps MUST NOT make a receive spin, and rawether MUST keep at most a fixed number
    of them, counting the ones it drops.
  priority: P1
  mitigations:
  - mitigation.bounded-report-queue
  acceptance:
  - given: a socket with transmit timestamps and 2 000 frames sent without reading their timestamps
    then: it returns after about 200 ms using little CPU, 1 024 timestamps can be read, and the lost count is the
      rest
    when: recv waits 200 ms with nothing to receive
  tasks: []
- id: SR-004
  statement: Reading transmit timestamps MUST NOT discard launch-time reports, and reading launch-time reports MUST
    NOT discard timestamps.
  priority: P2
  mitigations:
  - mitigation.one-dispatcher
  acceptance:
  - given: a socket with launch times and transmit timestamps through etf, one refused launch time and frames that
      left
    then: invalid = 1 and every sent frame's timestamp is there
    when: tx_errors and the timestamps are read in either order
  tasks: []
- id: SR-005
  statement: Error-queue control messages MUST be read only through the length-checked reader and ignored when the
    control buffer was truncated.
  priority: P2
  mitigations:
  - mitigation.checked-report-cmsgs
  acceptance:
  - given: the error-queue reader
    then: every payload is read with cmsg_payload and MSG_CTRUNC skips the message (unit test of the classifier
      over hand-built reports)
    when: it is reviewed
  tasks: []
- id: SR-006
  statement: Requesting transmit timestamps on a platform without them MUST make open fail with Unsupported.
  priority: P2
  mitigations:
  - mitigation.unsupported-is-an-error
  acceptance:
  - given: macOS or FreeBSD
    then: Unsupported, naming transmit timestamps
    when: a socket with transmit timestamps opens
  tasks: []
verification: []
decisions: []
