otmVersion: 0.2.0
project:
  id: 007-ptp-precision
  name: PTP precision — transmit timestamps and clock discovery
threatspec:
  actors:
  - id: actor.caller
    name: The application using rawether
    trust: trusted
  - id: actor.host-program
    name: Another program on the host sharing the NIC (ptp4l)
    trust: trusted
  - id: actor.kernel
    name: The kernel, writing error-queue reports and control messages
    trust: privileged
  - id: actor.segment-peer
    name: Any device able to put frames on the link or take it down
    trust: untrusted
  dispositions:
  - disposition: not-applicable
    reason: no authentication surface
    technique: credential-theft
  - disposition: no-threat-detected
    reason: 'checked the timestamp path: identifiers come from rawether''s own counter or the kernel, never from
      the network'
    technique: identity-spoofing
  - disposition: not-applicable
    reason: no persistent-store surface
    technique: data-tampering-at-rest
  - disposition: not-applicable
    reason: no audit-relevant surface
    technique: missing-audit-trail
  - disposition: not-applicable
    reason: 'no shared-tenant surface: one socket, one process'
    technique: cross-tenant-leak
  - disposition: not-applicable
    reason: no persistent-store surface
    technique: privilege-escalation-via-config
  - disposition: no-threat-detected
    reason: 'checked capability discovery: ETHTOOL_GET_TS_INFO is unprivileged by design and returns public metadata;
      NIC writes keep needing CAP_NET_ADMIN'
    technique: broken-access-control
  - disposition: no-threat-detected
    reason: 'checked the error queue: OPT_TSONLY returns no frame payload, so no frame data is looped back into
      the process'
    technique: sensitive-data-exposure
  exclusions:
  - entity: Timestamping capabilities
    reason: public interface metadata (ethtool reports it to any user); modelled as component.ts-info, no asset
  - entity: Frame identifier
    reason: part of asset.tx-time-integrity
