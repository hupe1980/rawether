    status: open
    actor: actor.kernel
    disposition: threat
    elements:
    - component.error-queue
    - flow.error-queue
    profile: stride
    severity: medium
    technique: injection
- id: threat.tx-reports-lost
  name: Reading transmit timestamps discards launch-time drop reports, or counting drops discards timestamps, so
    the caller loses one of them silently
  categories:
