mitigations:
- id: mitigation.is-length
  name: EtherType::is_length and Display of lengths as numbers only
  riskReduction: 60
  attributes:
    threats:
    - threat.length-read-as-type
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - src/ethertype.rs
- id: mitigation.registry-table-test
  name: A table test pins every constant to its registry value and source, and checks uniqueness and agreement with
    TagKind
  riskReduction: 90
  attributes:
    threats:
    - threat.wrong-constant-value
    status: verified
    kind: detective
    requirements:
    - SR-001
    touchpoints:
    - src/ethertype.rs
requirements:
- id: SR-001
  statement: Every named EtherType MUST equal its registry value, no two names MAY share a value, and VLAN/QINQ
    MUST equal TagKind's TPIDs.
  priority: P2
  mitigations:
  - mitigation.registry-table-test
  acceptance:
  - given: the table of names, values and sources
    then: every constant matches, values are unique, VLAN = TagKind::Customer.tpid(), QINQ = TagKind::Service.tpid()
    when: the test runs
  tasks: []
- id: SR-002
  statement: A value below 0x0600 MUST report is_length() and MUST NOT print a protocol name.
  priority: P2
  mitigations:
  - mitigation.is-length
  acceptance:
  - given: 0x0050 and 0x05ff
    then: true, and printed as numbers only
    when: is_length and Display run
  tasks: []
verification:
- id: verification.sr-001.2026-11-09
  requirement: SR-001
  method: test
  evidence: src/ethertype.rs::tests::every_name_has_its_registry_value
  result: pass
  verdict: verified
  justification: All 21 constants equal the registry table in research.md (Linux if_ether.h and IEEE assignments
    for IEC 61850), values are unique, VLAN and QINQ equal TagKind's TPIDs; name() round-trips.
  verified_at: '2026-11-09T14:08:27Z'
  commit: 8fa8759
- id: verification.sr-002.2026-11-09
  requirement: SR-002
  method: test
  evidence: src/ethertype.rs::tests::lengths_and_unnamed_values_print_as_numbers
  result: pass
  verdict: verified
  justification: 0x0000, 0x0050 and 0x05ff report is_length() and no name and print as numbers; 0x0600 is not a
    length; 0x9100 is unnamed.
  verified_at: '2026-11-09T14:08:27Z'
  commit: 8fa8759
