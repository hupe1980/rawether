- id: verification.sr-002.2026-11-09
  requirement: SR-002
  method: test
  evidence: 'tests/veth.rs with RAWETHER_RX=frame (scripts/veth-test.sh): a_hundred_thousand_frames_are_received_or_counted_as_dropped,
    sparse_frames_wait_in_the_ring_while_the_reader_is_busy'
  result: pass
  verdict: verified
  justification: On the frame ring received plus dropped equals sent for a 100 000-frame flood and later frames
    keep arriving; the held slot is released on the next receive and on drop.
  verified_at: '2026-11-09T15:30:06Z'
  commit: '4142732'
