mitigations:
- id: mitigation.checked-slot-walk
  name: Read a slot only after TP_STATUS_USER with acquire ordering; check mac >= header and mac + snaplen <= slot
    before slicing
  riskReduction: 90
  attributes:
    threats:
    - threat.slot-offsets-out-of-bounds
    status: verified
    kind: preventive
    requirements:
    - SR-001
    touchpoints:
    - src/ring.rs
    - src/sys/linux.rs
- id: mitigation.release-every-slot
  name: Every slot taken is released on the next receive, whether delivered or skipped
  riskReduction: 85
  attributes:
    threats:
    - threat.slot-never-released
    status: verified
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - src/sys/linux.rs
requirements:
- id: SR-001
  statement: The frame-ring walker MUST NOT form a slice outside the slot, and MUST NOT read a slot whose status
    lacks TP_STATUS_USER.
  priority: P2
  mitigations:
  - mitigation.checked-slot-walk
  acceptance:
  - given: synthetic slots with tp_mac below the header, tp_mac or tp_snaplen past the slot, and a kernel-owned
      status
    then: no frame is formed
    when: they are read
  - given: random slots
    then: no panic, no out-of-bounds access
    when: fuzzed and run under Miri
  tasks: []
- id: SR-002
  statement: Every frame-ring slot the reader takes MUST be returned to the kernel by the next receive, whether
    it was delivered or skipped.
  priority: P2
  mitigations:
  - mitigation.release-every-slot
  acceptance:
  - given: the veth suite on the frame ring (100 000-frame flood, sparse frames, malformed-free traffic)
    then: received plus dropped equals sent and later frames keep arriving
    when: it runs
  tasks: []
verification:
- id: verification.sr-001.2026-11-09
  requirement: SR-001
  method: test
  evidence: src/ring.rs::tests::a_frame_ring_slot_is_read_only_when_it_holds_together; fuzz/fuzz_targets/ring_walk.rs
